<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYC Search V2</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/search-v2.css?v=7">
    <link rel="stylesheet" href="css/glass-surface.css?v=6">
    <link rel="stylesheet" href="dist/react-bits-backgrounds.css?v=1">
</head>

<body>
    <div class="shader-canvas" id="reactBitsBackgroundRoot" aria-hidden="true"></div>
    <div class="screen-grid" aria-hidden="true"></div>

    <div class="top-left-buttons" id="shortcutButtons"></div>

    <div class="settings-container">
        <button class="circle-button settings-button" id="settingsButton" type="button" aria-label="设置">
            <span class="control-label"><i class="fas fa-cog" aria-hidden="true"></i></span>
        </button>

        <div class="settings-menu" id="settingsMenu" aria-hidden="true">
            <button class="settings-item" id="toggleDateBtn" type="button">
                <i class="fas fa-calendar-day" aria-hidden="true"></i>
                <span>日期显隐</span>
            </button>
            <button class="settings-item" id="toggleEngineBtn" type="button">
                <i class="fas fa-search" aria-hidden="true"></i>
                <span>默认引擎</span>
            </button>
            <button class="settings-item" id="editShortcutsBtn" type="button">
                <i class="fas fa-link" aria-hidden="true"></i>
                <span>编辑入口</span>
            </button>
            <button class="settings-item" id="toggleBackgroundBtn" type="button">
                <i class="fas fa-sun" aria-hidden="true"></i>
                <span id="backgroundLabel">背景：光线</span>
            </button>
        </div>
    </div>

    <main class="main-content" aria-label="新版搜索页面">
        <div class="background-picker" id="backgroundPicker" role="dialog" aria-modal="true"
            data-glass-distortion-scale="0" data-glass-red-offset="0" data-glass-green-offset="0"
            data-glass-blue-offset="0" data-glass-displace="0" data-glass-background-opacity="0.2"
            aria-labelledby="backgroundPickerTitle" aria-hidden="true">
            <div class="background-picker-header">
                <span id="backgroundPickerTitle">&#36873;&#25321;&#32972;&#26223;</span>
                <button class="tiny-button" id="closeBackgroundPickerBtn" type="button" aria-label="&#20851;&#38381;&#32972;&#26223;&#36873;&#25321;">
                    <span class="control-label"><i class="fas fa-xmark" aria-hidden="true"></i></span>
                </button>
            </div>
            <div class="background-options" id="backgroundOptions"></div>
        </div>

        <section class="search-container">
            <button class="logo" id="searchLogo" type="button" aria-label="切换搜索引擎">Baidu</button>
            <form class="search-form" id="searchForm" action="https://www.baidu.com/s" method="get" autocomplete="off">
                <input id="searchInput" class="search-box" name="wd" type="search" placeholder="输入关键词开始搜索"
                    spellcheck="false" autofocus>
                <button class="search-button" id="searchButton" type="submit" aria-label="搜索">
                    <span class="control-label"><i class="fas fa-search" aria-hidden="true"></i></span>
                </button>
            </form>
            <div class="suggestions-container" id="suggestionsContainer" role="listbox" aria-label="搜索建议"></div>
            <div class="date-info" id="dateInfo"></div>
        </section>
    </main>

    <div class="shortcut-inline-editor" id="shortcutInlineEditor" aria-hidden="true">
        <div class="shortcut-inline-header">
            <span id="shortcutEditorTitle">快捷入口</span>
            <button class="tiny-button" id="finishShortcutEditBtn" type="button" aria-label="完成">
                <span class="control-label"><i class="fas fa-check" aria-hidden="true"></i></span>
            </button>
        </div>
        <div class="shortcut-inline-fields">
            <input type="text" id="shortcutTitleInput" aria-label="入口名称" placeholder="名称">
            <input type="url" id="shortcutUrlInput" aria-label="跳转链接" placeholder="链接">
            <div class="icon-picker" id="shortcutIconPicker">
                <button class="icon-picker-trigger" id="shortcutIconTrigger" type="button" aria-label="选择图标">
                    <i id="shortcutIconPreview" class="fas fa-star" aria-hidden="true"></i>
                    <span id="shortcutIconLabel">星标</span>
                    <i class="fas fa-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="icon-bag" id="shortcutIconBag" aria-hidden="true"></div>
            </div>
        </div>
    </div>

    <a class="page-switch" href="search-v1.html" aria-label="切换到旧版搜索页面"
        onclick="localStorage.setItem('hycSearchPageVersion', 'v1')">
        <span class="control-label"><i class="fas fa-layer-group" aria-hidden="true"></i>旧版</span>
    </a>

    <script src="js/glass-surface.js?v=5"></script>
    <script src="dist/react-bits-backgrounds.js?v=1"></script>
    <script src="js/search-v2.js?v=7"></script>
</body>

</html>
